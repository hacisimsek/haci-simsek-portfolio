name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Temporarily audits production dependencies only. The remaining dev-only
      # advisories come from tailwindcss@3 and eslint-config-next@13 (via braces,
      # which has no patched release) and are resolved by the Tailwind 4 /
      # eslint-config-next 16 upgrade, which restores the full-tree audit.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        run: npm run build
